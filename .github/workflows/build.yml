name: Build

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache engines (vendor + cache)
        uses: actions/cache@v4
        with:
          path: |
            vendor
            .engine-cache
          key: vm-engines-${{ hashFiles('scripts/fetch-engines.js') }}

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Fetch engines (Kokoro runtime + whisper.cpp + Piper models)
        run: npm run fetch-engines

      - name: Run E2E tests
        run: npm run e2e

      - name: Build application
        run: npm run dist

      - name: Report installer size
        shell: pwsh
        run: |
          Get-ChildItem dist -Recurse -Filter *.exe | Select-Object FullName, @{ n='MB'; e={ [math]::Round($_.Length/1MB,2) } } | Format-Table -AutoSize

      - name: Verify packaged engines and real voice
        run: node scripts/verify-package.js

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-maker-dist
          path: dist/**/*
          retention-days: 7
